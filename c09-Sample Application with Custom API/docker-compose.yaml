services:
  keycloak:
    image: hydra-iam:latest
    env_file: .env
    restart: unless-stopped
    ports: [ "38080:8080" ]
    healthcheck:
      test: ["CMD-SHELL", "sh -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dex:
    image: hydra-idp:latest
    restart: unless-stopped
    ports: [ "5556:5556","5557:5557" ]
    depends_on:
      keycloak:
        condition: service_healthy

  hydra-server:
    env_file: .env
    image: hydra-server:latest
    restart: unless-stopped
    ports: [ "32001:3000" ]
    depends_on:
      dex:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-O", "-", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  hydra-client:
    image: hydra-client:latest
    env_file: .env
    container_name: hydra-client
    restart: unless-stopped
    ports: [ "32000:80" ]
    depends_on:
      hydra-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-O", "-", "http://127.0.0.1:80/manifest.json" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  minimal-html-client:
    image: minimal-html-client:latest
    env_file: .env
    restart: unless-stopped
    ports: [ "8080:80" ]
