<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor</title>
    <link href="vendor/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">MarkdownEditor</a>
        <div id="user-actions">
            <button id="login-btn" class="btn btn-primary btn-sm">Login</button>
        </div>
    </div>
</nav>

<div class="container editor">
    <div class="row">
        <div class="col-md-9">
            <form id="editor-form">
                <div class="mb-2">
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
                <textarea id="markdown-input" class="form-control" rows="15"># New Doc
Start writing!</textarea>
                <h5 class="mt-3">Preview</h5>
                <div id="markdown-preview"></div>
            </form>
        </div>
        <div class="col-md-3">
            <h6>Shared Grants</h6>
            <div id="grants-list"></div>
            <hr>
            <h6>Add Grant</h6>
            <form id="add-grant-form">
                <div class="mb-2">
                    <input type="text" id="grant-identifier" class="form-control" placeholder="Email or Domain">
                </div>
                <div class="mb-2">
                    <label><input type="checkbox" name="permissions" value="read"> Read</label>
                    <label><input type="checkbox" name="permissions" value="write"> Write</label>
                    <label><input type="checkbox" name="permissions" value="share"> Share</label>
                </div>
                <button type="submit" class="btn btn-success w-100">Add</button>
            </form>
        </div>
    </div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="js/grants.js"></script>
<script type="module"> import './js/main.js'; </script>
</body>
</html>
